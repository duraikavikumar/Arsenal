# Nginx configuration for both frontend and backend applications
# - Listens on HTTPS (port 443)
# - Serves frontend static files for general requests
# - Proxies API/backend requests to the Go backend service
# - Redirects HTTP traffic to HTTPS



# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name bot-gouat.aliceblueonline.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl http2;
    server_name bot-gouat.aliceblueonline.com;

    ssl_certificate /etc/ssl/certs/ssl-bundle.crt;
    ssl_certificate_key /etc/ssl/certs/domain.tld.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/bot-gouat-access.log;
    error_log  /var/log/nginx/bot-gouat-error.log;

    # Frontend (static files)
    location / {
        root /var/www/BOT/BOTFV3_FRONTEND_DIST;
        index index.html;
        try_files $uri /index.html;
    }

    # Backend (Go service)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;  # your Go backend port
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}

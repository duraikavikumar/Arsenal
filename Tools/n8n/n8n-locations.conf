Path=/etc/nginx/snippets/n8n-locations.conf

location = /n8n {
    return 301 /n8n/;
}

# Public webhooks (rate limited). Auth must also be set on each Webhook node.
location ^~ /n8n/webhook/ {
    limit_req zone=n8n_webhooks burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:5678/webhook/;
    include /etc/nginx/snippets/n8n-proxy.conf;
}

# Editor, REST API, push, webhook-test: restricted to office/VPN
location ^~ /n8n/ {
    allow 1.7.199.99;
    allow 122.185.117.146;
    allow 49.204.90.18;
    allow 182.75.143.62;
    allow 182.71.252.214;
    allow 117.200.55.113;
    allow 192.168.40.0/24;
    allow 192.168.40.0/24;
    deny all;

    proxy_pass http://127.0.0.1:5678/;
    include /etc/nginx/snippets/n8n-proxy.conf;
}

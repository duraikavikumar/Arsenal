Path:/etc/nginx/conf.d/erpnextdev.conf

limit_req_zone $binary_remote_addr zone=n8n_webhooks:10m rate=10r/s;

# Redirect all HTTP (port 80) traffic to HTTPS
server {
    listen 80 default_server;
    server_name crm-dev.aliceblueonline.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name crm-dev.aliceblueonline.com;

    # SSL certificates
    ssl_certificate /etc/ssl/certs/ssl-bundle.crt;
    ssl_certificate_key /etc/ssl/certs/domain.tld.key;

    # SSL settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logs
    access_log /var/log/nginx/alicecrm-uat-access.log;
    error_log  /var/log/nginx/alicecrm-uat-error.log;

    client_max_body_size 50m;
    # n8n at /n8n/
    include /etc/nginx/snippets/n8n-locations.conf;

    # Serve built CSS/JS from disk (do not proxy to Frappe)
    location /assets {
        root /var/www/frappe-bench/sites;
        expires max;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy traffic to backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

}


